services:
  erp-gamers:
    container_name: erp-gamers
    image: ghcr.io/erp-cnam/gamers:latest
    # ports:
    #   - <host>:<container>
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      - erp-connect

  erp-back:
    container_name: erp-back
    image: ghcr.io/erp-cnam/back:latest
    ports:
      - 3000:3000
    environment:
      - BACK_DATABASE_USER=${BACK_DATABASE_USER}
      - BACK_DATABASE_PASSWORD=${BACK_DATABASE_PASSWORD}
      - BACK_DATABASE_DB=${BACK_DATABASE_DB}
      - BACK_DATABASE_HOST=${BACK_DATABASE_HOST}
      - NODE_ENV=${BACK_NODE_ENV}
      - ADMIN_EMAIL=${BACK_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${BACK_ADMIN_PASSWORD}
      - ADMIN_FIRSTNAME=${BACK_ADMIN_FIRSTNAME}
      - ADMIN_LASTNAME=${BACK_ADMIN_LASTNAME}
      - JWT_SECRET=${CONNECT_JWT_SECRET}
      - DATABASE_URL=${BACK_DATABASE_URL}
      - CONNECT_API_KEY=${CONNECT_API_KEY}
      - CONNECT_URL=${CONNECT_URL}
      - DEBUG_ENABLED=${BACK_DEBUG_ENABLED}
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      erp-connect:
        condition: service_healthy
      erp-back-db:
        condition: service_healthy

  erp-money:
    container_name: erp-money
    image: ghcr.io/erp-cnam/money:latest
    ports:
      - 8080:8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      erp-back:
        condition: service_started
      erp-money-db:
        condition: service_healthy

  erp-bank:
    container_name: erp-bank
    image: ghcr.io/erp-cnam/bank:latest
    ports:
      - 3004:3004
    environment:
      - BANK_PORT=${BANK_PORT}
      - NODE_ENV=${BANK_NODE_ENV}
      - CONNECT_URL=${CONNECT_URL}
      - CONNECT_API_KEY=${CONNECT_API_KEY}
      - SERVICE_NAME=${BANK_SERVICE_NAME}
      - SERVICE_VERSION=${BANK_SERVICE_VERSION}
      - CONNECT_JWT_SECRET=${CONNECT_JWT_SECRET}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      - erp-back

  erp-connect:
    container_name: erp-connect
    image: ghcr.io/erp-cnam/connect:latest
    ports:
      - 8000:8000
    environment:
      - CONNECT_API_KEY=${CONNECT_API_KEY}
      - CONNECT_JWT_SECRET=${CONNECT_JWT_SECRET}
      - CONNECT_VERSION=${CONNECT_VERSION}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ping', timeout=2)\""]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  erp-back-db:
    container_name: erp-back-db
    image: postgres:18.1
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${BACK_DATABASE_USER}
      - POSTGRES_PASSWORD=${BACK_DATABASE_PASSWORD}
      - POSTGRES_DB=${BACK_DATABASE_DB}
    volumes:
      - erp-back-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACK_DATABASE_USER} -d ${BACK_DATABASE_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    
  erp-money-db:
    container_name: erp-money-db
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MONEY_DATABASE_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MONEY_DATABASE_DATABASE}
      - MYSQL_USER=${MONEY_DATABASE_USER}
      - MYSQL_PASSWORD=${MONEY_DATABASE_PASSWORD}
    volumes:
      - erp-money-data:/var/lib/mysql
      - ./config/money-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  erp:
    name: erp

volumes:
  erp-back-data:
  erp-money-data:
