services:
  erp-gamers:
    container_name: erp-gamers
    image: ghcr.io/erp-cnam/gamers:latest
    # ports:
    #   - <host>:<container>
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      - erp-connect

  erp-back:
    container_name: erp-back
    image: ghcr.io/erp-cnam/back:latest
    ports:
      - 3000:3000
    environment:
      - BACK_DATABASE_USER=${BACK_DATABASE_USER}
      - BACK_DATABASE_PASSWORD=${BACK_DATABASE_PASSWORD}
      - BACK_DATABASE_DB=${BACK_DATABASE_DB}
      - BACK_DATABASE_HOST=${BACK_DATABASE_HOST}
      - NODE_ENV=${BACK_NODE_ENV}
      - ADMIN_EMAIL=${BACK_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${BACK_ADMIN_PASSWORD}
      - ADMIN_FIRSTNAME=${BACK_ADMIN_FIRSTNAME}
      - ADMIN_LASTNAME=${BACK_ADMIN_LASTNAME}
      - JWT_SECRET=${CONNECT_JWT_SECRET}
      - DATABASE_URL=${BACK_DATABASE_URL}
      - REPOSITORY=${BACK_REPOSITORY}
      - CONNECT_API_KEY=${CONNECT_API_KEY}
      - CONNECT_URL=${CONNECT_URL}
      - DEBUG_ENABLED=${BACK_DEBUG_ENABLED}
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      erp-connect:
        condition: service_started
      erp-back-db:
        condition: service_healthy

  erp-money:
    container_name: erp-money
    image: ghcr.io/erp-cnam/money:latest
    # ports:
    #   - <host>:<container>
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      - erp-connect

  erp-bank:
    container_name: erp-bank
    image: ghcr.io/erp-cnam/bank:latest
    # ports:
    #   - <host>:<container>
    volumes:
      # - <host>:<container>
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    depends_on:
      - erp-connect

  erp-connect:
    container_name: erp-connect
    image: ghcr.io/erp-cnam/connect:latest
    ports:
      - 8000:8000
    environment:
      - CONNECT_API_KEY=${CONNECT_API_KEY}
      - CONNECT_JWT_SECRET=${CONNECT_JWT_SECRET}
      - CONNECT_VERSION=${CONNECT_VERSION}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp

  erp-back-db:
    container_name: erp-back-db
    image: postgres:18.1
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${BACK_DATABASE_USER}
      - POSTGRES_PASSWORD=${BACK_DATABASE_PASSWORD}
      - POSTGRES_DB=${BACK_DATABASE_DB}
    volumes:
      - erp-back-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACK_DATABASE_USER} -d ${BACK_DATABASE_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  erp:
    name: erp

volumes:
  erp-back-data:
